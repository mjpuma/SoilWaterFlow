<g font-size="12" text-anchor="middle"><text x="375" y="119">Shared upper soil</text><text x="375" y="255">Deeper water: sorghum access only</text><text x="375" y="421">Arrows show possible uptake, not equal shares or measured fluxes.</text><text x="375" y="439">Illustrative root depths match the mixture example.</text></g></g></svg>